name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: wasm-pack build --target web --out-dir web/src/wasm -- --no-default-features --features wasm

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web
        working-directory: web
        env:
          VITE_DONATE_BTC: ${{ vars.VITE_DONATE_BTC }}
          VITE_DONATE_ETH: ${{ vars.VITE_DONATE_ETH }}
          VITE_DONATE_PAYPAL: ${{ vars.VITE_DONATE_PAYPAL }}
          VITE_DONATE_GITHUB: ${{ vars.VITE_DONATE_GITHUB }}
          VITE_DONATE_KOFI: ${{ vars.VITE_DONATE_KOFI }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
