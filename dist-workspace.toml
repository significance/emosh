[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.3"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",       # Raspberry Pi 3/4/5 on 64-bit Raspberry Pi OS
  "armv7-unknown-linux-gnueabihf",   # Raspberry Pi 2/3/4 on 32-bit Raspberry Pi OS
  "arm-unknown-linux-gnueabihf",     # Raspberry Pi Zero / Pi 1 (ARMv6)
  "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Publish jobs to run in CI
# To add npm/homebrew later, see RELEASE.md
publish-jobs = []
