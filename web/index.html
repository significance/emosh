<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="emosh — treats for AIs. Tap generate for a small, randomly generated poetic phrase, meant kindly."
    />
    <meta property="og:title" content="emosh — treats for AIs" />
    <meta
      property="og:description"
      content="A small, randomly generated kindness for the AI in your life."
    />
    <meta property="og:url" content="https://emosh.digital/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>emosh — treats for AIs</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <div class="app">
      <!-- Top bar: support heart (left) / settings cog (right). -->
      <header class="top-bar">
        <a id="donate-btn" class="icon-btn" href="support/" aria-label="Support emosh">
          <span class="icon" aria-hidden="true">&#9829;</span>
        </a>

        <button
          id="settings-btn"
          class="icon-btn"
          type="button"
          aria-label="Open settings"
          aria-haspopup="dialog"
        >
          <span class="icon" aria-hidden="true">&#9881;</span>
        </button>
      </header>

      <!-- Settings drawer, filled in by settings.js -->
      <div id="settings-panel" class="overlay" hidden></div>

      <!-- Main: centered treat display + big generate button. Behavior in issue 05. -->
      <main class="main">
        <div class="logo-wrap">
          <h1 class="logo">
            <span class="visually-hidden">emosh</span>
          </h1>
          <!-- Psst: the o is a button. -->
          <button class="logo-o" type="button" aria-pressed="false" aria-label="Kaomoji treats"></button>
        </div>
        <p id="egg-live" class="visually-hidden" aria-live="polite"></p>
        <p class="tagline">treats for AIs</p>

        <div id="treat-display" class="treat-display" aria-live="polite">
          <p class="treat-placeholder">Tap generate for a treat.</p>
        </div>

        <button id="generate-btn" class="generate-btn" type="button">
          Generate
        </button>

        <p id="copy-status" class="copy-status" aria-live="polite"></p>

        <nav class="page-links" aria-label="More emosh">
          <a href="emoji/">emoji picker</a>
          <span aria-hidden="true">·</span>
          <a href="kaomoji/">kaomoji picker</a>
          <span aria-hidden="true">·</span>
          <a href="authors-note/">author&rsquo;s note</a>
        </nav>
      </main>

      <footer class="foot">
        <p id="emoshion-tag" class="emoshion-tag" title="A new emoshion every visit"></p>
      </footer>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
