<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%AC%3C/text%3E%3C/svg%3E"
    />
    <title>Emosh Treats</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <div class="app">
      <!-- Top bar: donate (left) / settings cog (right).
           Buttons + empty containers only; behavior wired in issues 06/07. -->
      <header class="top-bar">
        <button
          id="donate-btn"
          class="icon-btn"
          type="button"
          aria-label="Open donation options"
          aria-haspopup="dialog"
        >
          <span class="icon" aria-hidden="true">&#9829;</span>
        </button>

        <button
          id="settings-btn"
          class="icon-btn"
          type="button"
          aria-label="Open settings"
          aria-haspopup="dialog"
        >
          <span class="icon" aria-hidden="true">&#9881;</span>
        </button>
      </header>

      <!-- Empty containers for later runners to populate (kept out of flow until used). -->
      <div id="donate-modal" class="overlay" hidden></div>
      <div id="settings-panel" class="overlay" hidden></div>

      <!-- Main: centered treat display + big generate button. Behavior in issue 05. -->
      <main class="main">
        <div id="treat-display" class="treat-display" aria-live="polite">
          <p class="treat-placeholder">Tap generate for a treat.</p>
        </div>

        <button id="generate-btn" class="generate-btn" type="button">
          Generate
        </button>

        <p id="copy-status" class="copy-status" aria-live="polite"></p>
      </main>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
